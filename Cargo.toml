[package]
name = "hifi-api"
version = "2.10.0"
edition = "2021"
description = "Tidal Music Proxy with intelligent multi-account management"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "socks", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["future"] }
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
arc-swap = "1"
tame-index = "0.4"
futures = "0.3.33"
form_urlencoded = "1.2"
sha2 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp", "connection-manager"] }

# Smaller release binary for container deploys (cheap; no LTO so Render
# builder times stay sane).
[profile.release]
strip = true
