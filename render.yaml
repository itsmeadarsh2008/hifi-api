services:
  - type: web
    name: hifi-api
    runtime: image
    repo: https://github.com/itsmeadarsh2008/hifi-api
    plan: free
    # Render only marks the deploy live after this returns 200 (and
    # restarts unhealthy instances). /health is exempt from API-key auth
    # and never blocks on a dead Redis (15s cached verdict).
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: /data/hifi.db
      - key: ADMIN_KEY
        sync: false
      - key: COUNTRY_CODE
        value: US
      - key: RUST_LOG
        value: info
      - key: AUTO_SETUP
        value: "true"
      # This host's pool Redis (native rediss:// URL, Layerbase). Secrets
      # stay in the dashboard — never commit values.
      - key: REDIS_POOL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
