app = "hifi-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "/data/hifi.db"
  COUNTRY_CODE = "US"
  RUST_LOG = "info"
  AUTO_SETUP = "true"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.concurrency]]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[mounts]]
  source = "data"
  destination = "/data"
